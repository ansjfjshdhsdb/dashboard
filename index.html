<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>СіЯ Панель</title>
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div class="app">
  <aside class="side" aria-label="Навігація">
    <a class="brand" href="#overview"><span class="brand-mark"><img class="logo-light" src="img/logo-black.png" alt="СіЯ" width="305" height="154"><img class="logo-dark" src="img/logo-white.png" alt="СіЯ" width="305" height="153"></span><span class="brand-sub">Дашбоард</span></a>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>

  <main class="main">
    <div class="main-inner">
      <div class="mobile-head">
        <a class="brand" href="#overview"><span class="brand-mark"><img class="logo-light" src="img/logo-black.png" alt="СіЯ" width="305" height="154"><img class="logo-dark" src="img/logo-white.png" alt="СіЯ" width="305" height="153"></span><span class="brand-sub">панель</span></a>
        <div class="right" id="mobile-account"></div>
      </div>
      <header class="top">
        <h1 id="page-title">Огляд</h1>
        <div class="top-tools">
          <div class="search" id="global-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="global-q" placeholder="Знайти гравця: нік, ID, Telegram" autocomplete="off" aria-label="Знайти гравця" aria-controls="global-results" aria-expanded="false">
            <div class="search-results" id="global-results" role="listbox" hidden></div>
          </div>
          <button class="icon-btn" type="button" data-act="refresh" title="Оновити дані" aria-label="Оновити дані">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
          </button>
        </div>
      </header>
      <div id="view" aria-live="polite"></div>
    </div>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Розділи"></nav>
</div>

<dialog class="dlg" id="dlg"></dialog>
<div class="drawer-veil" id="drawer-veil"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Профіль гравця"></aside>
<div class="tip" id="tip" role="tooltip"></div>
<div class="toasts" id="toasts" aria-live="assertive"></div>

<script src="dashboard.js?v=7"></script>
